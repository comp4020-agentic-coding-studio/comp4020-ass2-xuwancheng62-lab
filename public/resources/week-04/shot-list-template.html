<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shot list and storyboard template</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #111;
    background: #fff;
    margin: 0;
    padding: 2rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 0.25rem;
  }
  p.byline {
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
    color: #444;
  }
  .shot {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 1rem;
    border: 1px solid #111;
    padding: 0.75rem;
    margin-bottom: 1rem;
    page-break-inside: avoid;
  }
  .shot .fields {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #444;
    margin-bottom: 0.15rem;
  }
  .field .line {
    border-bottom: 1px solid #999;
    min-height: 1.3rem;
  }
  .sketch {
    border: 1px dashed #666;
    min-height: 220px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0.35rem;
  }
  .sketch span {
    font-size: 0.7rem;
    color: #888;
  }
  footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: #444;
  }
  @media print {
    body { padding: 0.5in; }
    .shot { break-inside: avoid; }
  }
</style>
</head>
